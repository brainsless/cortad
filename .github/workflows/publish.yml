# Publishes cortad from this repository with npm provenance: the release on npm links to the exact
# commit and run that built it. Triggered by a version tag; npm accepts it through trusted
# publishing (OIDC), so no npm token exists anywhere.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      # A prerelease (0.3.0-rc.1) goes out under the next tag, so a stack can walk it before a
      # customer's `npx cortad` resolves to it.
      - run: npm publish --access public $(node -p "require('./package.json').version.includes('-') ? '--tag next' : ''")
