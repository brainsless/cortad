# The stores the shared host's staging stack keeps its real library in, beside the app's own test
# containers: what a run should read when the person chooses it.
name: ask-later-staging
services:
  mongo:
    image: mongo:7.0.14
    ports:
      - "27119:27017"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9202:9200"
